name: Check offer links

# Auto re-checks every offer URL weekly (and on demand). This is the
# "auto-updating" heartbeat: dead or expired offers surface as a failed run
# plus an uploaded link-report.json artifact.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/check-links.mjs'
      # the classifier and fetch layer decide pass/warn/fail — a change there
      # changes what this workflow writes, so it must re-run on them too
      - 'src/domain/verification/**'
      - '.github/workflows/check-links.yml'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check links & expiry
        run: npm run check-links
        env:
          # The checker reads published offers from Supabase (RLS-gated anon read).
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Optional until configured. When present, the checker writes the whole
          # run atomically to link_checks + offers.last_checked/status.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-report
          path: link-report.json
